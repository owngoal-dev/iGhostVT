# Pushes and pull requests: compile, package and verify every flavour, and
# keep the packages for thirty days. Nothing is published from here — a tag
# publishes, through `release.yml`, the packages of its commit's run, once
# that run has passed.
#
# The package jobs share nothing: each is a machine recipe, and they run in
# parallel so a roothide box, a rootless box, and a Mac box
# can all work at once. They communicate only by `upload-artifact`. The
# `packages` job is the merge — it collects those artifacts, counts them, and
# uploads the one `ighostvt-<sha>` a tag downloads.
#
# workflow_dispatch can run all three or just one (`platform`), and can pin
# each job to a runner label so the three machines do not have to be
# GitHub-hosted. A single-platform dispatch skips the merge: a partial set of
# artifacts is not something a release can be cut from. A dispatch on a tag
# (`gh workflow run ci.yml --ref vX.Y.Z`) is how a commit that never reached
# main gets the run `release.yml` publishes, and the way back once an
# artifact is past its thirty days.
#
# The version is the commit's own (`Configuration/Version.xcconfig`, written
# by `make set-version` in the release commit), so the packages a push builds
# are already named for the tag that follows it. Only a dispatch on a tag
# overrides it, since then there is a tag to read.
#
# The terminal core comes from the released Lakr233/libghostty-spm package
# (resolved by xcodebuild from Package.resolved), so this checkout is all
# the build needs.
#
# The relay (`Relay/`, Go, standard library only) is the fourth job. It
# vets and tests the server, builds its image for linux/amd64 and
# linux/arm64, and — on every event but a pull request, a tag dispatch
# included — pushes it to GHCR as `ighostvt-relay:sha-<commit>`. That tag is
# the only image ever built for the commit: `release.yml` gives the same
# digest its release tags and builds nothing. Its `compose.yml` rides into
# `ighostvt-<sha>` beside the packages, so the release attaches the file CI
# handed over rather than whatever the checkout holds at tag time.
#
# Ghost Remote (`package-ipa`) is the fifth: the remote-only app for an
# iPhone or iPad without custom firmware, packaged as an ad-hoc signed .ipa
# that AltStore, SideStore or Sideloadly re-sign as they install it. It is
# cut from the same commit and build number as the packages beside it, since
# a paired device has to be on the same release line.
#
# The macOS zip is ad-hoc signed. A runner has no Developer ID certificate
# and nothing here should invent one, so the artifact is exactly what
# `make mac-zip` produces on a checkout with no signing identity: a
# universal, hardened-runtime bundle that Gatekeeper will not trust on
# sight. Whoever installs it clears the quarantine bit once — the release
# notes say so, and so does the packager. The Developer ID, notarized copy is
# made from this very zip once a release publishes it (notarize.yml), with
# the identity kept in that workflow's secrets, never here.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Which package to build
        type: choice
        options:
          - all
          - roothide
          - rootless
          - macos
          - ipa
        default: all
      runner_roothide:
        description: Runner label for the roothide .deb
        type: string
        default: macos-26
      runner_rootless:
        description: Runner label for the rootless .deb
        type: string
        default: macos-26
      runner_macos:
        description: Runner label for the macOS zip
        type: string
        default: macos-26
      runner_ipa:
        description: Runner label for the Ghost Remote .ipa
        type: string
        default: macos-26

permissions:
  contents: read

# A pull request's new push cancels the run of its old one. A push to main
# keeps its own run however soon the next one follows: a tag on that commit
# publishes what that run built, so cancelling it destroys the artifact the
# tag needs.
concurrency:
  group: ighostvt-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # CFBundleVersion used to be the run number of the workflow that published:
  # 0.9.8 shipped build 81, from release.yml's 81st run. The number
  # `release.sh` commits to Version.xcconfig was never what shipped — CI
  # overrode it at tag time — and it now stands at 74. Left alone, the next
  # release would go backwards, and LaunchServices keeps the record of the
  # higher build and goes on reading the old Info.plist from it. The floor
  # carries this file's counter past the old workflow's last run. Raise it,
  # never lower it.
  BUILD_NUMBER_FLOOR: "100"

jobs:
  package-roothide:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'roothide'
    runs-on: ${{ github.event.inputs.runner_roothide || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # The runner image ships with third-party taps Homebrew no longer trusts
      # by default and warns about on every invocation; none of them is used.
      - name: Install packaging tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ldid dpkg xcbeautify
          ldid -h 2>&1 | head -n1 || true
          dpkg-deb --version | head -n1

      # The version is the commit's — the tag branch is for a dispatch against
      # a tag, the documented way back once an artifact has aged out. The
      # build number is always this run's, floored so it keeps climbing past
      # the counter the old publishing workflow left behind. All three jobs
      # take the same number from the same run, so the three packages agree.
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          make set-version VERSION="$version" BUILD="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"

      - name: Build roothide package (iphoneos-arm64e)
        run: make deb-roothide

      # Each job is its own build, so each ships the dSYMs of its own
      # binaries; neither strip nor ldid touches LC_UUID, so they match.
      - name: Archive dSYMs
        run: |
          version="$(make --no-print-directory print-version)"
          cd /private/tmp/ighostvt-deriveddata/Build/Products/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/build/Packages/iGhostVT-${version}-roothide-dSYMs.zip" *.dSYM

      - name: Checksums
        run: |
          cd build/Packages
          shasum -a 256 *.deb *-dSYMs.zip | tee SHA256SUMS.roothide

      # A transport between jobs of this run, not the release's artifact: the
      # `packages` job below merges these three into `ighostvt-<sha>`.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ighostvt-roothide
          path: |
            build/Packages/*.deb
            build/Packages/*-dSYMs.zip
            build/Packages/SHA256SUMS.roothide
          if-no-files-found: error
          retention-days: 1

  package-rootless:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'rootless'
    runs-on: ${{ github.event.inputs.runner_rootless || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install packaging tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ldid dpkg xcbeautify
          ldid -h 2>&1 | head -n1 || true
          dpkg-deb --version | head -n1

      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          make set-version VERSION="$version" BUILD="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"

      - name: Build rootless package (iphoneos-arm64)
        run: make deb-rootless

      - name: Archive dSYMs
        run: |
          version="$(make --no-print-directory print-version)"
          cd /private/tmp/ighostvt-deriveddata/Build/Products/Release-iphoneos
          zip -qry "$GITHUB_WORKSPACE/build/Packages/iGhostVT-${version}-rootless-dSYMs.zip" *.dSYM

      - name: Checksums
        run: |
          cd build/Packages
          shasum -a 256 *.deb *-dSYMs.zip | tee SHA256SUMS.rootless

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ighostvt-rootless
          path: |
            build/Packages/*.deb
            build/Packages/*-dSYMs.zip
            build/Packages/SHA256SUMS.rootless
          if-no-files-found: error
          retention-days: 1

  package-macos:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: ${{ github.event.inputs.runner_macos || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # No ldid or dpkg here: `make mac-zip` deliberately does not depend on
      # `make check`, so a machine with nothing but Xcode can produce the zip.
      - name: Install build tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcbeautify

      # Same tag and the same run number as the .deb jobs, so the version in
      # the app's About screen matches the one on the packages beside it.
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          make set-version VERSION="$version" BUILD="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"

      # MAC_ZIP_IDENTITY defaults to "-", so this is the ad-hoc path. Universal
      # (arm64 + x86_64) and hardened-runtime; see the header of this file.
      - name: Build the macOS app
        run: make mac-zip

      # The app is the Catalyst build, the helper and CLI the plain macOS one.
      - name: Archive dSYMs
        run: |
          version="$(make --no-print-directory print-version)"
          cd /private/tmp/ighostvt-deriveddata/Build/Products
          zip -qry "$GITHUB_WORKSPACE/build/Packages/iGhostVT-${version}-macos-dSYMs.zip" \
            Release-maccatalyst/*.dSYM Release/*.dSYM

      - name: Checksums
        run: |
          cd build/Packages
          shasum -a 256 *.zip | tee SHA256SUMS.macos

      - name: Verify the bundled helper
        run: |
          app="$(mktemp -d)/iGhostVT.app"
          ditto -x -k build/Packages/iGhostVT-*-macos.zip "$(dirname "$app")"
          test -x "$app/Contents/MacOS/ighostvtd" || { echo "the helper is missing" >&2; exit 1; }
          test -x "$app/Contents/MacOS/ighostvt-cli" || { echo "the command-line client is missing" >&2; exit 1; }
          test -f "$app/Contents/Library/LaunchAgents/wiki.qaq.ighostvtd.plist" \
            || { echo "the bundled agent plist is missing" >&2; exit 1; }
          lipo -info "$app/Contents/MacOS/iGhostVT"
          lipo -info "$app/Contents/MacOS/ighostvtd"
          lipo -info "$app/Contents/MacOS/ighostvt-cli"
          # The daemon admits the CLI by this identifier, not by its filename.
          codesign --display --verbose=2 "$app/Contents/MacOS/ighostvt-cli" 2>&1 \
            | grep -qx 'Identifier=wiki.qaq.ighostvt-cli' \
            || { echo "the CLI carries the wrong signing identifier" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ighostvt-macos
          path: |
            build/Packages/*.zip
            build/Packages/SHA256SUMS.macos
          if-no-files-found: error
          retention-days: 1

  package-ipa:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ipa'
    runs-on: ${{ github.event.inputs.runner_ipa || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Like the Mac zip, nothing but Xcode: `make ipa` does not run `check`.
      - name: Install build tools
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcbeautify

      # The same version and build number as the other packages: AltStore
      # checks both against its source, and a paired host checks the line.
      - name: Pin the build number to this run
        shell: bash
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          make set-version VERSION="$version" BUILD="$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_FLOOR ))"

      - name: Build the Ghost Remote .ipa
        run: make ipa

      # Nothing private may be asked for: an installer's free certificate
      # cannot grant it, and AltStore compares what it finds with its source.
      - name: Verify the .ipa
        run: |
          set -euo pipefail
          version="$(make --no-print-directory print-version)"
          ipa="build/Packages/GhostRemote-${version}.ipa"
          root="$(mktemp -d)"
          ditto -x -k "$ipa" "$root"
          app="$root/Payload/GhostRemote.app"
          test -x "$app/GhostRemote" || { echo "the app's executable is missing" >&2; exit 1; }
          test -f "$app/Licenses.json" || { echo "Licenses.json is missing" >&2; exit 1; }
          # The Live Activity, and nothing else: each extension costs an
          # installer's free account one more App ID.
          extensions="$(cd "$app/PlugIns" && ls)"
          [ "$extensions" = GhostRemoteWidgets.appex ] \
            || { echo "the .ipa should carry GhostRemoteWidgets.appex alone, carries: $extensions" >&2; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$version" ] \
            || { echo "the app is not version $version" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          for bundle in "$app" "$app/PlugIns/GhostRemoteWidgets.appex"; do
            entitlements="$(codesign --display --entitlements - --xml "$bundle" 2>/dev/null || true)"
            if grep -q '<key>' <<<"$entitlements"; then
              echo "$(basename "$bundle") carries entitlements:" >&2
              echo "$entitlements" >&2
              exit 1
            fi
          done

      - name: Checksums
        run: |
          cd build/Packages
          shasum -a 256 *.ipa | tee SHA256SUMS.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ighostvt-ipa
          path: |
            build/Packages/*.ipa
            build/Packages/SHA256SUMS.ipa
          if-no-files-found: error
          retention-days: 1

  # The relay server and its image. Not a platform package, so a
  # single-platform dispatch skips it along with the merge below. A pull
  # request builds the image but pushes nothing: its run is never published,
  # and a fork's token cannot write packages anyway.
  relay:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: Relay

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      # The go directive in go.mod is the oldest toolchain the relay claims
      # to build with, so that is the one the tests run on; the image's
      # builder stage is newer.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: Relay/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # The same version the packages are named for, so `ighostvt-relay
      # version` inside the image says which release it shipped in.
      - name: Read the version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^MARKETING_VERSION = //p' ../Configuration/Version.xcconfig)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$version" ] || { echo "no version in Version.xcconfig" >&2; exit 1; }
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/ighostvt-relay" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The Dockerfile cross-compiles on the build platform, so neither
      # architecture needs QEMU.
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: Relay
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ighostvt-relay
          path: Relay/compose.yml
          if-no-files-found: error
          retention-days: 1

  # Merge. Needs every platform job; a skipped sibling (a single-platform
  # dispatch) skips this too, which is what we want — a partial set of
  # artifacts is not a release. Tag pushes and pushes to main run all four,
  # then this, and its artifact is what `release.yml` downloads.
  packages:
    needs: [package-roothide, package-rootless, package-macos, package-ipa, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: ighostvt-*
          merge-multiple: false

      - name: Stage the packages
        run: |
          set -euo pipefail
          mkdir -p build/Packages
          find artifacts -type f \( -name '*.deb' -o -name '*.zip' -o -name '*.ipa' -o -name 'SHA256SUMS*' -o -name 'compose.yml' \) -exec cp {} build/Packages/ \;
          cd build/Packages
          ls -l
          test -f SHA256SUMS.roothide || { echo "roothide checksums missing" >&2; exit 1; }
          test -f SHA256SUMS.rootless || { echo "rootless checksums missing" >&2; exit 1; }
          test -f SHA256SUMS.macos || { echo "macos checksums missing" >&2; exit 1; }
          test -f SHA256SUMS.ipa || { echo "ipa checksums missing" >&2; exit 1; }
          test -f compose.yml || { echo "the relay's compose.yml is missing" >&2; exit 1; }
          # One file for every .deb, matching the layout previous releases
          # attached, plus Ghost Remote's .ipa and the relay's compose.yml;
          # the macOS checksums stay beside the zip.
          { cat SHA256SUMS.roothide SHA256SUMS.rootless SHA256SUMS.ipa; sha256sum compose.yml; } > SHA256SUMS
          rm -f SHA256SUMS.roothide SHA256SUMS.rootless SHA256SUMS.ipa
          shopt -s nullglob
          debs=(*.deb)
          zips=(*-macos.zip)
          dsyms=(*-dSYMs.zip)
          ipas=(*.ipa)
          [[ "${#ipas[@]}" -eq 1 ]] || { echo "expected 1 ipa, got ${#ipas[@]}" >&2; exit 1; }
          [[ "${#debs[@]}" -eq 2 ]] || { echo "expected 2 debs, got ${#debs[@]}" >&2; exit 1; }
          [[ "${#zips[@]}" -eq 1 ]] || { echo "expected 1 zip, got ${#zips[@]}" >&2; exit 1; }
          [[ "${#dsyms[@]}" -eq 3 ]] || { echo "expected 3 dSYM zips, got ${#dsyms[@]}" >&2; exit 1; }

      # The lists the packaging jobs wrote, checked once here so a bad upload
      # is this run's failure rather than the tag's. `release.yml` checks them
      # again on the other side of its own download.
      - name: Verify the checksums
        working-directory: build/Packages
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS.macos

      # What a tag publishes. Thirty days, and `if-no-files-found: error`
      # because an empty artifact would fail at the tag instead of here.
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: ighostvt-${{ github.sha }}
          path: |
            build/Packages/*.deb
            build/Packages/*.zip
            build/Packages/*.ipa
            build/Packages/compose.yml
            build/Packages/SHA256SUMS
            build/Packages/SHA256SUMS.macos
          if-no-files-found: error
          retention-days: 30
